<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control del taller</title>
<!-- Template: build inlines tokens.css + screens.css at CSS (for the mini preview), every
     episode as <script type="application/json" id="episodes">[…]</script> at EPISODES,
     and nav.js, render.js, animate.js, control.js at JS. No external references. -->
<style>
/* Every colour, font and size of the stage. When Cursor or the terminal change, edit here.
   Sizes are for the fixed 1600x900 canvas (the stage scales it). */
:root {
  /* canvas */
  --ws-w: 1600px;
  --ws-h: 900px;

  /* fonts */
  --ws-font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ws-font-mono: "SF Mono", Menlo, Monaco, "Courier New", monospace;
  --ws-fs: 15px;          /* Cursor body text */
  --ws-fs-sm: 13.5px;     /* sidebar, tabs, footers */
  --ws-fs-xs: 12.5px;     /* section labels, ages */
  --ws-fs-h4: 19px;       /* say #### heading */
  --ws-fs-mono: 13.5px;   /* code, chips, zsh */
  --ws-fs-term: 16px;     /* personal terminal and Claude Code */
  --ws-lh: 1.6;
  --ws-lh-mono: 1.55;
  --ws-lh-tight: 1.3;     /* user label block */
  --ws-lh-list: 2;        /* file tree, Open Tabs */
  --ws-caret-w: .6em;     /* terminal caret block */

  /* spacing and radii */
  --ws-gap: 12px;
  --ws-pad: 18px;
  --ws-pad-sm: 8px;
  --ws-pad-xs: 4px;
  --ws-radius: 12px;
  --ws-radius-sm: 6px;
  --ws-radius-xs: 4px;
  --ws-line: 1px;

  /* window chrome */
  --ws-dot: 12px;
  --ws-dot-r: #ff5f57;
  --ws-dot-y: #febc2e;
  --ws-dot-g: #28c840;

  /* Cursor, light theme */
  --ws-c-bg: #ffffff;
  --ws-c-side: #f3f3f3;
  --ws-c-line: #e6e6e6;
  --ws-c-tx: #1d1d1f;
  --ws-c-tx2: #3a3a3c;
  --ws-c-mut: #7a7a7a;
  --ws-c-faint: #a0a0a0;
  --ws-c-sel: #e3e3e3;
  --ws-c-chip: #f2f2f2;
  --ws-c-code: #efefef;
  --ws-c-send-bg: #111111;
  --ws-c-send-fg: #ffffff;
  --ws-c-plus: #1a7f37;
  --ws-c-avatar: #8a7b6b;
  --ws-c-shadow: 0 1px 4px rgba(0, 0, 0, .06);
  --ws-c-sidebar-w: 250px;
  --ws-c-right-w: 680px;
  --ws-c-tree-w: 230px;
  --ws-c-zsh-h: 400px;
  --ws-c-opentabs-w: 270px;
  --ws-c-top-h: 40px;
  --ws-c-tabs-h: 40px;
  --ws-c-avatar-s: 26px;
  --ws-c-send-s: 22px;
  --ws-c-preview-fs: 28px;

  /* zsh prompt segments inside Cursor (light) */
  --ws-z-bg: #ffffff;
  --ws-z-tx: #1d1d1f;
  --ws-z-apple-bg: #ffffff;
  --ws-z-apple-fg: #111111;
  --ws-z-path-bg: #1f4f8f;
  --ws-z-path-fg: #ffffff;
  --ws-z-git-bg: #2a8a76;
  --ws-z-git-fg: #ffffff;
  --ws-z-sys-bg: #8e1f6f;
  --ws-z-sys-fg: #ffffff;
  --ws-z-time-bg: transparent;
  --ws-z-time-fg: #1d1d1f;
  --ws-z-fill: #7a7a7a;
  --ws-z-path-icon: #ffffff;
  --ws-z-sys-icon: #ffffff;
  --ws-z-time-icon: #1d1d1f;
  --ws-z-ok: #2ea043;
  --ws-z-out: #3a3a3c;

  /* personal terminal (dark) */
  --ws-t-bg: #252830;
  --ws-t-bar: #2d3139;
  --ws-t-bar-fg: #c9ced8;
  --ws-t-tx: #d7dae0;
  --ws-t-mut: #8b919c;
  --ws-t-cmd: #79c0ff;
  --ws-t-ok: #7ee000;
  --ws-t-caret: #d7dae0;
  --ws-t-apple-bg: #d0d4db;
  --ws-t-apple-fg: #111111;
  --ws-t-path-bg: #86a6cc;
  --ws-t-path-fg: #ffffff;
  --ws-t-path-icon: #ffffff;
  --ws-t-git-bg: #2f8f8a;
  --ws-t-git-fg: #ffffff;
  --ws-t-sys-bg: #b994c9;
  --ws-t-sys-fg: #1b1b22;
  --ws-t-sys-icon: #1b1b22;
  --ws-t-time-bg: #d6d9df;
  --ws-t-time-fg: #111111;
  --ws-t-time-icon: #111111;
  --ws-t-fill: #5d6370;
  --ws-t-bar-h: 34px;
  --ws-seg-slant: 8px;
  --ws-fill-w: 2px;       /* dotted fill between prompt segments */
  --ws-icon-s: 1em;       /* prompt icons (folder, house, clock), inline SVG */
  --ws-icon-gap: .4em;    /* space between a prompt icon and its text */
  --ws-icon-drop: -.14em; /* vertical-align of prompt icons on the text baseline */

  /* Claude Code tab */
  --ws-cc-accent: #d97757;
  --ws-cc-ok: #3fb950;
  --ws-cc-user: #ffa657;  /* the person's turn, as in the cc-* mockups */
  --ws-cc-bang: #f778ba;  /* a `!` command the person runs in bash mode */
  --ws-cc-box: #5d6370;
  --ws-cc-gutter: 2ch;    /* width of the ⏺ / ⎿ / > gutter */

  /* browser window of a page step */
  --ws-p-w: 92%;
  --ws-p-h: 90%;
  --ws-p-bg: #ffffff;
  --ws-p-bar: #f1f1f3;

  /* macOS approval window */
  --ws-a-scrim: rgba(0, 0, 0, .28);
  --ws-a-bg: #ececec;
  --ws-a-tx: #1d1d1f;
  --ws-a-mut: #4a4a4c;
  --ws-a-line: #d2d2d2;
  --ws-a-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  --ws-a-w: 560px;
  --ws-a-radius: 14px;
  --ws-a-icon: 56px;
  --ws-a-icon-bg: #2d6cdf;
  --ws-a-btn-bg: #ffffff;
  --ws-a-btn-fg: #1d1d1f;
  --ws-a-ok-bg: #0a6cf0;
  --ws-a-ok-fg: #ffffff;
  --ws-a-fs-title: 17px;
  --ws-a-fs: 14px;
  --ws-a-lh: 1.45;
  /* the tool's own approval panel (alert.js): light or dark like macOS, because its page follows the system too */
  --ws-r-bg: #ececec;
  --ws-r-tx: #1d1d1f;
  --ws-r-bar-tx: #4a4a4c;
  --ws-r-btn-bg: #ffffff;
  --ws-r-btn-line: #c8c8c8;
  --ws-r-bar: 28px;         /* title bar */
  --ws-r-foot: 58px;        /* the button bar under the page (alert.js `bar`) */
  --ws-r-btn-h: 28px;
  --ws-r-btn-cancel: 90px;
  --ws-r-btn-ok: 130px;
  --ws-r-fs-btn: 13px;

  /* callouts on the current step (note bubble, box, underline, tag) */
  --ws-co-mark: #ff5a1f;
  --ws-co-tag-fg: #ffffff;
  --ws-co-note-bg: #fff4b8;
  --ws-co-note-tx: #3b3000;
  --ws-co-note-line: #f2cf3d;
  --ws-co-note-w: 520px;
  --ws-co-note-fs: 17px;
  --ws-co-note-shadow: 0 6px 18px rgba(0, 0, 0, .18);
  --ws-co-box-w: 3px;
  --ws-co-under-w: 3px;

  /* chapter card */
  --ws-k-grad: linear-gradient(135deg, #2d6cdf, #7a4fe0);
  --ws-k-fg: #ffffff;
  --ws-k-fs-kicker: 22px;
  --ws-k-fs-title: 88px;
  --ws-k-fs-sub: 30px;
  --ws-k-pad: 140px;
  --ws-k-sub-w: 1100px;
  --ws-k-kicker-track: .12em;
  --ws-k-kicker-op: .8;
  --ws-k-sub-op: .9;
  --ws-k-title-mt: .2em;
  --ws-k-title-mb: .3em;
  --ws-k-lh-title: 1.05;
  --ws-k-lh-sub: 1.35;
  --ws-k-pitch-mt: 56px;
  --ws-k-pitch-w: 1180px;
  --ws-k-pitch-pad: 28px 36px;
  --ws-k-pitch-bg: rgba(255, 255, 255, .12);
  --ws-k-pitch-radius: 14px;
  --ws-k-fs-pitch-k: 18px;
  --ws-k-fs-pitch: 30px;
  --ws-k-lh-pitch: 1.3;
  --ws-k-pitch-gap: 8px;
  --ws-k-pitch-row-gap: 22px;
  --ws-k-keys-bottom: 56px;
  --ws-k-keys-gap: 28px;
  --ws-k-key-label-gap: 12px;
  --ws-k-key: 56px;
  --ws-k-key-radius: 10px;
  --ws-k-key-border: rgba(255, 255, 255, .7);
  --ws-k-fs-key: 30px;
  --ws-k-fs-keys: 24px;
}

/* Stage screens: card, cursor-full, cursor-agent, terminal, claude-code, approve overlay.
   Values come from tokens.css; this file only lays things out. */
.ws-screen {
  position: relative; box-sizing: border-box; width: var(--ws-w); height: var(--ws-h);
  overflow: hidden; font-family: var(--ws-font-ui);
}
.ws-screen *, .ws-screen *::before, .ws-screen *::after { box-sizing: border-box; }
.ws-empty { background: var(--ws-c-bg); }
.ws-mut { color: var(--ws-c-mut); }

/* bottom-anchored area: short content on top, long content shows its newest part */
.ws-scroll { display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; min-height: 0; }
.ws-flow { flex: 1 0 auto; }

.ws-dots { display: flex; gap: calc(var(--ws-dot) / 2); }
.ws-dot { display: inline-block; width: var(--ws-dot); height: var(--ws-dot); border-radius: 50%; }
.ws-dot-r { background: var(--ws-dot-r); }
.ws-dot-y { background: var(--ws-dot-y); }
.ws-dot-g { background: var(--ws-dot-g); }

/* ---------- chapter card ---------- */
.ws-card { background: var(--ws-k-grad); color: var(--ws-k-fg); display: flex; align-items: center; }
.ws-card-inner { padding: 0 var(--ws-k-pad); }
.ws-card-kicker { font-size: var(--ws-k-fs-kicker); letter-spacing: var(--ws-k-kicker-track); text-transform: uppercase; opacity: var(--ws-k-kicker-op); }
.ws-card-title { margin: var(--ws-k-title-mt) 0 var(--ws-k-title-mb); font-size: var(--ws-k-fs-title); line-height: var(--ws-k-lh-title); font-weight: 700; }
.ws-card-sub { margin: 0; font-size: var(--ws-k-fs-sub); opacity: var(--ws-k-sub-op); max-width: var(--ws-k-sub-w); line-height: var(--ws-k-lh-sub); }
.ws-card-pitch { margin-top: var(--ws-k-pitch-mt); max-width: var(--ws-k-pitch-w); padding: var(--ws-k-pitch-pad);
  background: var(--ws-k-pitch-bg); border-radius: var(--ws-k-pitch-radius); }
.ws-card-pitch-k { font-size: var(--ws-k-fs-pitch-k); letter-spacing: var(--ws-k-kicker-track); text-transform: uppercase;
  opacity: var(--ws-k-kicker-op); margin-bottom: var(--ws-k-pitch-gap); }
.ws-card-pitch-ask, .ws-card-pitch-does { font-size: var(--ws-k-fs-pitch); line-height: var(--ws-k-lh-pitch); }
.ws-card-pitch-ask { font-style: italic; margin-bottom: var(--ws-k-pitch-row-gap); }
.ws-card-keys { position: absolute; left: var(--ws-k-pad); bottom: var(--ws-k-keys-bottom); display: flex;
  align-items: center; gap: var(--ws-k-keys-gap); }
.ws-card-key { display: flex; align-items: center; gap: var(--ws-k-key-label-gap); }
.ws-key { display: inline-flex; align-items: center; justify-content: center; width: var(--ws-k-key); height: var(--ws-k-key);
  border: 2px solid var(--ws-k-key-border); border-bottom-width: 5px; border-radius: var(--ws-k-key-radius);
  background: var(--ws-k-pitch-bg); font-size: var(--ws-k-fs-key); font-weight: 700; line-height: 1; }
.ws-card-key-t, .ws-card-keys-t { font-size: var(--ws-k-fs-keys); opacity: var(--ws-k-sub-op); }
.ws-card-keys-t { margin-left: var(--ws-k-keys-gap); }

/* ---------- Cursor ---------- */
.ws-cursor { display: flex; background: var(--ws-c-bg); color: var(--ws-c-tx); font-size: var(--ws-fs); line-height: var(--ws-lh); }
.ws-sb {
  width: var(--ws-c-sidebar-w); flex: none; background: var(--ws-c-side); border-right: var(--ws-line) solid var(--ws-c-line);
  display: flex; flex-direction: column; padding: var(--ws-gap) 0; font-size: var(--ws-fs-sm); color: var(--ws-c-tx2);
}
.ws-sb .ws-dots { padding: 0 var(--ws-gap) var(--ws-pad); }
.ws-sb-nav { padding: var(--ws-pad-xs) var(--ws-gap); }
.ws-sb-sec { padding: var(--ws-pad) var(--ws-gap) var(--ws-pad-xs); color: var(--ws-c-mut); font-size: var(--ws-fs-xs); }
.ws-sb-repo { padding: var(--ws-pad-xs) var(--ws-gap); }
.ws-sb-chat {
  display: flex; gap: var(--ws-pad-sm); justify-content: space-between;
  margin: 0 var(--ws-pad-sm); padding: var(--ws-pad-xs) var(--ws-pad-sm) var(--ws-pad-xs) var(--ws-pad);
  border-radius: var(--ws-radius-sm);
}
.ws-sb-chat-t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ws-sb-chat b { font-weight: 400; color: var(--ws-c-mut); flex: none; }
.ws-sb-chat.ws-on { background: var(--ws-c-sel); color: var(--ws-c-tx); }
.ws-me { margin-top: auto; padding: var(--ws-gap); display: flex; align-items: center; gap: var(--ws-pad-sm); line-height: var(--ws-lh-tight); }
.ws-avatar { width: var(--ws-c-avatar-s); height: var(--ws-c-avatar-s); border-radius: 50%; background: var(--ws-c-avatar); flex: none; }

.ws-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ws-top {
  height: var(--ws-c-top-h); flex: none; display: flex; align-items: center; padding: 0 var(--ws-pad);
  font-size: var(--ws-fs-sm); color: var(--ws-c-tx2);
}
.ws-top-r { margin-left: auto; color: var(--ws-c-mut); font-size: var(--ws-fs-xs); white-space: pre; }
.ws-conv { flex: 1; padding: 0 var(--ws-pad); }
.ws-conv .ws-flow { display: flex; flex-direction: column; gap: var(--ws-gap); padding-bottom: var(--ws-gap); }
.ws-ask {
  border: var(--ws-line) solid var(--ws-c-line); border-radius: var(--ws-radius); padding: var(--ws-gap) var(--ws-gap) var(--ws-pad-sm);
  box-shadow: var(--ws-c-shadow); background: var(--ws-c-bg); white-space: pre-wrap;
}
.ws-ask-row { display: flex; align-items: center; gap: var(--ws-gap); margin-top: var(--ws-pad-sm); color: var(--ws-c-mut); font-size: var(--ws-fs-sm); white-space: normal; }
.ws-send {
  margin-left: auto; width: var(--ws-c-send-s); height: var(--ws-c-send-s); border-radius: 50%;
  background: var(--ws-c-send-bg); color: var(--ws-c-send-fg); display: flex; align-items: center; justify-content: center; font-size: var(--ws-fs-xs);
}
.ws-worked { color: var(--ws-c-mut); }
.ws-tool {
  align-self: flex-start; font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); color: var(--ws-c-tx2);
  background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: var(--ws-pad-xs) var(--ws-pad-sm);
  white-space: pre-wrap; word-break: break-word;
}
.ws-ran { display: flex; flex-direction: column; gap: var(--ws-pad-xs); }
.ws-ran-out {
  font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); line-height: var(--ws-lh-mono); color: var(--ws-z-out);
  border: var(--ws-line) solid var(--ws-c-line); border-radius: var(--ws-radius-sm); padding: var(--ws-pad-sm) var(--ws-gap);
}
.ws-ran-out .ws-out { white-space: pre-wrap; word-break: break-word; }
.ws-say p, .ws-say ul, .ws-say h4 { margin: 0 0 var(--ws-pad-sm); }
.ws-say > :last-child { margin-bottom: 0; }
.ws-say h4 { font-size: var(--ws-fs-h4); margin-top: var(--ws-pad-xs); }
.ws-say ul { padding-left: var(--ws-pad); }
.ws-md-table { overflow-x: auto; margin: 0 0 var(--ws-pad-sm); }
.ws-md-table table { border-collapse: collapse; font-size: var(--ws-fs-sm); }
.ws-md-table th, .ws-md-table td {
  border: var(--ws-line) solid var(--ws-c-line); padding: var(--ws-pad-xs) var(--ws-pad-sm); text-align: left;
  white-space: nowrap;
}
.ws-md-table th { font-weight: 600; }
.ws-cursor code {
  font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); background: var(--ws-c-code);
  border-radius: var(--ws-radius-xs); padding: 0 var(--ws-pad-xs);
}
.ws-followup {
  flex: none; margin: var(--ws-pad-sm) var(--ws-pad) var(--ws-pad-xs); border: var(--ws-line) solid var(--ws-c-line);
  border-radius: var(--ws-radius); padding: var(--ws-pad-sm) var(--ws-gap); display: flex; color: var(--ws-c-faint);
  font-size: var(--ws-fs-sm); box-shadow: var(--ws-c-shadow); white-space: pre;
}
.ws-followup-m { margin-left: auto; color: var(--ws-c-mut); }
.ws-foot { flex: none; display: flex; gap: var(--ws-pad); padding: var(--ws-pad-xs) var(--ws-pad) var(--ws-gap); color: var(--ws-c-mut); font-size: var(--ws-fs-sm); }

/* right panel (cursor-full) */
.ws-rp { width: var(--ws-c-right-w); flex: none; border-left: var(--ws-line) solid var(--ws-c-line); display: flex; flex-direction: column; font-size: var(--ws-fs-sm); }
.ws-rp-tabs { height: var(--ws-c-tabs-h); flex: none; display: flex; align-items: center; gap: var(--ws-gap); padding: 0 var(--ws-gap); color: var(--ws-c-mut); }
.ws-tab.ws-on { background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: 0 var(--ws-pad-sm); font-style: italic; color: var(--ws-c-tx); }
.ws-rp-sub {
  height: var(--ws-c-tabs-h); flex: none; display: flex; align-items: center; padding: 0 var(--ws-gap);
  color: var(--ws-c-tx2); border-top: var(--ws-line) solid var(--ws-c-line); border-bottom: var(--ws-line) solid var(--ws-c-line); white-space: pre;
}
.ws-rp-sub-r { margin-left: auto; display: flex; gap: var(--ws-pad-sm); color: var(--ws-c-mut); }
.ws-pill { background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: 0 var(--ws-pad-sm); color: var(--ws-c-tx); }
.ws-rp-files { flex: 1; min-height: 0; display: flex; }
.ws-preview { flex: 1; padding: var(--ws-pad); }
.ws-preview h1 { margin: var(--ws-pad-sm) 0 0; font-size: var(--ws-c-preview-fs); }
.ws-tree { width: var(--ws-c-tree-w); flex: none; border-left: var(--ws-line) solid var(--ws-c-line); padding: var(--ws-gap) var(--ws-pad-sm); color: var(--ws-c-tx2); line-height: var(--ws-lh-list); }
.ws-tree-h { color: var(--ws-c-mut); padding: 0 var(--ws-pad-xs); }
.ws-tree-i { padding: 0 var(--ws-pad-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-zsh { height: var(--ws-c-zsh-h); flex: none; border-top: var(--ws-line) solid var(--ws-c-line); background: var(--ws-z-bg); display: flex; flex-direction: column; }
.ws-zsh-tabs { flex: none; display: flex; align-items: center; gap: var(--ws-gap); padding: var(--ws-pad-sm) var(--ws-gap) 0; color: var(--ws-c-mut); }
.ws-zsh-title { flex: none; padding: var(--ws-pad-sm) var(--ws-gap); color: var(--ws-c-tx2); }
.ws-zsh-body {
  flex: 1; padding: 0 var(--ws-gap) var(--ws-pad-sm); font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono);
  line-height: var(--ws-lh-mono); color: var(--ws-z-tx);
}

/* Open Tabs column (cursor-agent) */
.ws-opentabs { width: var(--ws-c-opentabs-w); flex: none; padding: var(--ws-c-top-h) var(--ws-pad) var(--ws-pad); color: var(--ws-c-tx2); font-size: var(--ws-fs-sm); line-height: var(--ws-lh-list); }
.ws-ot-h { color: var(--ws-c-mut); font-size: var(--ws-fs-xs); margin-top: var(--ws-gap); }
.ws-ot-h:first-child { margin-top: 0; }
.ws-plus { color: var(--ws-c-plus); }

/* ---------- shell lines (zsh in Cursor and personal terminal) ---------- */
.ws-prompt { display: flex; align-items: center; white-space: nowrap; margin-top: var(--ws-pad-xs); }
.ws-seg {
  display: inline-block; padding: 0 calc(var(--ws-seg-slant) + var(--ws-pad-xs));
  clip-path: polygon(var(--ws-seg-slant) 0, 100% 0, calc(100% - var(--ws-seg-slant)) 100%, 0 100%);
  margin-right: calc(var(--ws-seg-slant) / -2);
}
.ws-seg-apple { clip-path: polygon(0 0, 100% 0, calc(100% - var(--ws-seg-slant)) 100%, 0 100%); }
.ws-seg-fill { flex: 1; align-self: center; height: 0; margin: 0 var(--ws-pad-sm); border-bottom: var(--ws-fill-w) dotted; }
.ws-ico { display: inline-block; width: var(--ws-icon-s); height: var(--ws-icon-s); vertical-align: var(--ws-icon-drop); }
.ws-ico-folder { margin-right: var(--ws-icon-gap); }

n","out":["Cloning into 'skills/jira-kanban'..."],"source":"inferido","cwd":"~","notes":"Primero bajamos el repo, que trae las cuatro skills y el comando jtk. Es un git clone común. Necesitás Python 3.9 o más, git y acceso por SSH a la organización (el repo es privado); si hiciste el episodio 0 ya lo tenés. El nombre de la carpeta da igual: el instalador calcula dónde está. Paso inferido: necesita red."},{"type":"term","cmd":"~/skills/jira-kanban/install.sh --with-write","out":["skill: jira-standup (Claude Code, Codex, Cursor) -\u003e ~/skills/jira-kanban/jira-standup","skill: jira-em (Claude Code, Codex, Cursor) -\u003e ~/skills/jira-kanban/jira-em","skill: jira-team-kit (Claude Code, Codex, Cursor) -\u003e ~/skills/jira-kanban","skill: jira-em-ops (Claude Code, Codex, Cursor) -\u003e ~/skills/jira-kanban/jira-em-ops","cli: jtk -\u003e ~/skills/jira-kanban/jtk.py","note: add ~/.local/bin to PATH to use jtk"],"source":"real","cwd":"~","notes":"Esta es toda la instalación. Mirá las cuatro líneas «skill:»: dos de lectura (standup y em) y dos que escriben (jira-team-kit y jira-em-ops). Remarcá que no copia nada, son enlaces, y que se enlazan a la vez en Claude Code, Codex y Cursor. Y mirá el aviso del final: jtk existe, pero falta el PATH.","pause":true},{"type":"term","cmd":"echo 'export PATH=\"$HOME/.local/bin:$PATH\"' \u003e\u003e ~/.zshrc","out":[],"source":"real","cwd":"~","notes":"El aviso se arregla con una línea en tu ~/.zshrc. Después, abrís una terminal nueva. Si te trabás acá, es el error número uno: «el agente dice que jtk no existe»."},{"type":"term","cmd":"~/.local/bin/jtk --version","out":["jtk 93a6126 2026-10-14"],"source":"real","cwd":"~","notes":"Comprobamos que quedó andando. Imprime el commit y su fecha. Lo corremos con la ruta completa porque esta terminal todavía no tiene el PATH nuevo; en una terminal nueva alcanza con jtk --version. Todavía no tocamos Jira, ni hace falta."},{"type":"term","cmd":"open -e ~/.zshrc","out":[],"source":"inferido","cwd":"~","notes":"Ahora lo único que no hace el agente: las credenciales. Creás un token de API en id.atlassian.com, con el botón «Create API token» a secas, no el que dice «with scopes»: jtk entra por la URL de tu sitio y un token con alcance no funciona. Lo guardás vos, con un editor, en tres variables: JIRA_BASE_URL, JIRA_EMAIL y JIRA_API_TOKEN. Nunca por el chat. Después cerrás Cursor del todo y lo abrís de nuevo.","pause":true}]},{"id":"caso-principal","title":"Caso principal","subtitle":"De «creame una épica» a PLAT-123, con tu clic","screen":"cursor-full","faq":[{"q":"¿Puede el agente escribir en Jira sin que yo lo sepa?","a":"No. Todo comando que escribe necesita --apply, y --apply abre una ventana que solo responde a un clic tuyo en «Apruebo». El agente te avisa antes de lanzarla, pero no puede aprobar por vos."},{"q":"¿Y si aprieto Cancelar, o me voy a tomar un café?","a":"No se escribe nada. Cancelar, Escape, cerrar la ventana o esperar 100 segundos dan lo mismo: el comando sale sin crear y el agente no vuelve a intentarlo salvo que se lo pidas."},{"q":"¿Qué pasa si Jira rechaza una tarea a mitad de camino?","a":"Lo creado se conserva y jtk te dice las claves. Repetir el mismo comando retoma sin duplicar. Si solo falla un cambio de estado, no se repite el create: se termina con un push."},{"q":"¿Por qué «Vos · en curso» y «A decidir»?","a":"Lo que dijiste que estás haciendo se te asigna sin preguntar. Lo que todavía no empezó necesita tu respuesta: asignártelo o dejarlo sin dueño. jtk nunca lo decide por vos."},{"q":"¿Y el MCP de Atlassian que Cursor sugiere cuando escribo «jira»?","a":"No lo uses junto a esta skill. Sus herramientas de escritura no pasan por la ventana de aprobación. La skill le dice al agente que Jira va siempre por jtk."}],"steps":[{"type":"ask","text":"creame una épica para esto que estuvimos trabajando","source":"inferido","notes":"Una frase, como se la dirías a un compañero. Fijate el chat de la izquierda: veníamos hablando del tope al descuento. De ahí saca el contenido; nada de llenar formularios. Pedir así, al cerrar un trabajo, es el hábito que queremos instalar."},{"type":"tool","label":"Read · ~/.cursor/skills/jira-team-kit/SKILL.md","source":"inferido","notes":"Cursor reconoce el pedido y carga la skill. Desde acá el agente sigue pasos fijos, no improvisa. El primero: mirar antes de escribir."},{"type":"tool","label":"Ran · jtk update --check","source":"inferido","notes":"Una vez por conversación mira si hay una versión nueva del jtk. Es solo lectura, no toca Jira. Si todo está al día no dice nada, y acá no dice nada: ese es el comportamiento correcto."},{"type":"term","cmd":"~/.local/bin/jtk create --check --project .","out":["Check          Result  Detail","wow plan       no      no wow/plan/manifest.json","jira project   none    ask the person which project and pass --jira-project KEY","existing epic  none    none in specs/*/spec.md or the branch; a key in the conversation is not checked here"],"source":"real","cwd":"~/mi-servicio","notes":"Tres filas, sin red ni credenciales. «wow plan»: si el trabajo ya sale de un plan de WayOfWork, la épica la crea otra herramienta. «jira project»: no hay proyecto por defecto, así que hay que preguntarlo. «existing epic»: si ya existe una épica para esto, se pregunta antes de crear otra. Acá no hay ni plan ni épica. Falta el proyecto. Y una aclaración: el comando sale con la ruta completa, ~/.local/bin/jtk, porque la captura corre sin tu PATH; en tu terminal alcanza con escribir jtk.","pause":true},{"type":"say","md":"No hay plan de WayOfWork ni una épica previa para esto, pero no tengo un proyecto de Jira por defecto. **¿En qué proyecto la creo?**","source":"inferido","notes":"El agente se frena y pregunta, porque la skill dice que nunca se adivina el proyecto. Esta es una de las pocas preguntas obligatorias."},{"type":"ask","text":"En PLAT.","source":"inferido","notes":"Una palabra alcanza. Desde acá el agente pasa --jira-project PLAT en todos los comandos."},{"type":"tool","label":"Read · ~/.cursor/skills/jira-team-kit/references/spec.md","source":"inferido","notes":"Antes de redactar lee el formato del spec. Cada épica, tarea y subtarea necesita tres cosas: por qué, qué y hecho cuando. Si falta una, jtk se niega a seguir. Es lo que evita tickets de una línea que nadie entiende dentro de un mes."},{"type":"tool","label":"Write · ~/scratchpad/spec.json","source":"inferido","notes":"El spec es un JSON que el agente arma desde la conversación: una épica, una tarea con una subtarea, y otra tarea. Lo deja en su carpeta temporal, no en tu repo."},{"type":"term","cmd":"jtk create --spec ~/scratchpad/spec.json --jira-project PLAT --html ~/scratchpad/vista.html --project .","out":["Issue        Tipo      Estado       Asignado        Título","NUEVO-1      Epic      Backlog      A decidir       Tope de descuento","  NUEVO-2    Tarea     En progreso  Vos · en curso  [BE] Acotar el descuento","    NUEVO-3  Subtarea  Backlog      A decidir       Test del tope","  NUEVO-4    Tarea     Backlog      A decidir       [BE] Documentar el tope","preview: ~/scratchpad/vista.html","dry run: nothing created; --apply creates 4 issues in PLAT"],"source":"inferido","cwd":"~/mi-servicio","notes":"El dry run: lo que se crearía, sin escribir nada. La tabla y una página vista.html con forma de pantalla de Jira. Fijate «NUEVO-1»: todavía no hay claves reales. La tarea que decimos que estamos haciendo ya figura «En progreso» y «Vos · en curso»; el resto, «A decidir». Esta salida es inferida: sin credenciales de Jira el comando no corre en la captura, y el formato sale del showcase de la skill.","pause":true},{"type":"tool","label":"Ran · open ~/scratchpad/vista.html","source":"inferido","notes":"Abre la vista previa en el navegador."},{"type":"page","title":"~/scratchpad/vista.html","source":"real","notes":"Esta es la página que genera jtk, tal cual: la sacamos de su código (tools/jtk_vista.py). Árbol a la izquierda, y por issue el por qué, ill=\"none\" stroke-linecap=\"round\"/\u003e\u003c/svg\u003e \u003cspan class=\"k\"\u003eNUEVO-4\u003c/span\u003e\u003c/div\u003e\n  \u003ch1\u003e[BE] Documentar el tope\u003c/h1\u003e\n  \u003cdiv class=\"cols\"\u003e\n    \u003cdiv\u003e\n      \u003ch3\u003eDescripción\u003c/h3\u003e\u003cdiv class=\"desc\"\u003e\u003ch4\u003ePor qué\u003c/h4\u003e\u003cp\u003eQuien arma promociones no sabe que el descuento tiene un techo.\u003c/p\u003e\u003ch4\u003eQué\u003c/h4\u003e\u003cp\u003eExplicar la regla del tope, con un ejemplo, en el README del servicio.\u003c/p\u003e\u003ch4\u003eHecho cuando\u003c/h4\u003e\u003cp\u003eEl README dice qué pasa cuando los cupones superan el subtotal.\u003c/p\u003e\u003c/div\u003e\n      \u003ch3\u003eSubtareas\u003c/h3\u003e\u003cp class=\"muted\"\u003eNinguno.\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv\u003e\n      \u003cdiv class=\"status\"\u003eBacklog \u003cspan class=\"muted\"\u003e▾\u003c/span\u003e\u003c/div\u003e\n      \u003cdiv class=\"panel\"\u003e\u003ch4\u003eDetalles\u003c/h4\u003e\n        \u003cdiv class=\"row\"\u003e\u003cspan class=\"lbl\"\u003eTipo\u003c/span\u003e\u003cspan\u003e\u003csvg viewBox=\"0 0 16 16\" class=\"ti\"\u003e\u003crect width=\"16\" height=\"16\" rx=\"3\" fill=\"#4BADE8\"/\u003e\u003cpath d=\"m4.5 8.2 2.3 2.3 4.7-4.9\" stroke=\"#fff\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"/\u003e\u003c/svg\u003e Tarea\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"row\"\u003e\u003cspan class=\"lbl\"\u003eResponsable\u003c/span\u003e\u003cspan class=\"who\"\u003e\u003cspan class=\"av off\"\u003e\u003csvg viewBox=\"0 0 16 16\" width=\"14\" height=\"14\"\u003e\u003ccircle cx=\"8\" cy=\"5.5\" r=\"3\" fill=\"#fff\"/\u003e\u003cpath d=\"M2.5 14c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5z\" fill=\"#fff\"/\u003e\u003c/svg\u003e\u003c/span\u003e A decidir\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"row\"\u003e\u003cspan class=\"lbl\"\u003ePrioridad\u003c/span\u003e\u003cspan\u003e\u003csvg viewBox=\"0 0 16 16\" class=\"pi\"\u003e\u003cpath d=\"M3 6h10M3 10h10\" stroke=\"#E2B203\" stroke-width=\"2\"/\u003e\u003c/svg\u003e Medium\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"row\"\u003e\u003cspan class=\"lbl\"\u003eEtiquetas\u003c/span\u003e\u003cspan\u003e\u003cspan class=\"muted\"\u003eNinguno\u003c/span\u003e\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"row\"\u003e\u003cspan class=\"lbl\"\u003ePrincipal\u003c/span\u003e\u003cspan\u003e\u003ca href=\"#NUEVO-1\"\u003e\u003csvg viewBox=\"0 0 16 16\" class=\"ti\"\u003e\u003crect width=\"16\" height=\"16\" rx=\"3\" fill=\"#904EE2\"/\u003e\u003cpath d=\"M9.2 3 5 9h2.6L6.8 13 11 7H8.4z\" fill=\"#fff\"/\u003e\u003c/svg\u003e \u003cspan class=\"k\"\u003eNUEVO-1\u003c/span\u003e\u003c/a\u003e\u003c/span\u003e\u003c/div\u003e\n        \u003cdiv class=\"foot\"\u003eSe crea en el paso 4 de 4, después de NUEVO-1.\u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/section\u003e\n\u003c/main\u003e\n\u003c/div\u003e\n\u003cscript\u003e\n(function(){var ids=[].map.call(document.querySelectorAll('.issue'),function(s){return s.id});\nfunction show(){var id=location.hash.slice(1);if(ids.indexOf(id)\u003c0)id=ids[0];\n[].forEach.call(document.querySelectorAll('.issue'),function(s){s.classList.toggle('on',s.id===id)});\n[].forEach.call(document.querySelectorAll('.side a'),function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+id)});\nwindow.scrollTo(0,0);}window.addEventListener('hashchange',show);show();})();\n\u003c/script\u003e\n\u003c/body\u003e\u003c/html\u003e\n"},{"type":"say","md":"Armé la épica con **1 tarea con una subtarea** y **1 tarea más**, en PLAT. Abrí `vista.html` para revisarla.\n\nUna decisión que es tuya:\n- la tarea del tope ya la estás haciendo, así que queda **En progreso y a tu nombre**\n- las otras dos están abiertas: **¿te las asigno a vos o las dejo sin asignar?**\n\nCuando me digas, creo todo. No escribo nada hasta tu respuesta.","source":"inferido","notes":"Dos cosas para remarcar. Una: la skill espera un sí explícito antes de escribir. Dos: pregunta por las asignaciones y no las supone. Es la diferencia entre una herramienta que ordena y una que decide por vos.","pause":true},{"type":"ask","text":"Asignámelas a mí y creala.","source":"inferido","notes":"Ese es el sí explícito, con la respuesta sobre las asignaciones incluida. Recién ahora el agente puede ir al comando que escribe."},{"type":"say","md":"Voy a correr el comando que **escribe en Jira**. **Se va a abrir una ventana** con las 4 issues que se crean en PLAT, quién las recibe y los botones **Cancelar** y **Apruebo 4**.\n\nLa aprobación es tu clic en esa ventana: mi pregunta de recién no cuenta, y yo no puedo tocarla. Si cancelás, no lo vuelvo a correr salvo que me lo pidas.","source":"inferido","notes":"Este aviso es parte de la regla de la skill: antes de lanzar un comando con --apply, el agente dice en el chat que se abre una ventana y qué va a aprobarse. Y que la persona tiene que estar presente. Por eso este momento no se apura: esperá a que cada quien lo lea.","pause":true},{"type":"approve","title":"Crear en PLAT","button":"Apruebo 4","source":"inferido","notes":"La ventana de jtk, tal cual la dibuja su código: arriba, cuántos issues, a quién quedan y «⇄ 1 cambio de estado»; abajo, una tarjeta por issue. La tarea del tope lleva «En progreso»: se crea y se mueve, y las dos escrituras se aprueban acá. El botón dice cuántos. Escape cancela; ninguna tecla aprueba, solo el clic. El agente espera. Formato real, datos de ejemplo.","pause":true,"window":"jtk · Jira","width":520,"height":462,"html":"\u003c!doctype html\u003e\u003chtml\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cstyle\u003e\n:root{color-scheme:light dark;--fg:#1d1d1f;--muted:#6e6e73;--card:rgba(0,0,0,.045);--line:rgba(0,0,0,.08);\n --chip-bg:rgba(0,0,0,.07);--to-bg:rgba(0,113,227,.12);--to-fg:#0058b0;--out:#9a5b00;--out-bg:rgba(255,159,10,.14)}\n@media (prefers-color-scheme:dark){:root{--fg:#f5f5f7;--muted:#a1a1a6;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.1);\n --chip-bg:rgba(255,255,255,.12);--to-bg:rgba(10,132,255,.22);--to-fg:#6cb4ff;--out:#ffb340;--out-bg:rgba(255,159,10,.16)}}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:transparent;color:var(--fg);font:13px/1.4 -apple-system,BlinkMacSystemFont,\"SF Pro Text\",sans-serif;\n -webkit-font-smoothing:antialiased;cursor:default;-webkit-user-select:none}\nbody{padding:22px 24px 8px}\n.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\nh1{font-size:19px;line-height:1.25;font-weight:650;margin:4px 0 16px}\n.cards{list-style:none;margin:0;padding:0;display:grid;gap:8px}\n.card{background:var(--card);border-radius:10px;padding:10px 12px;display:grid;gap:6px}\n.top{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}\n.key{flex:0 1 auto;min-width:0;overflow-wrap:anywhere;font:600 11.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--chip-bg);border-radius:5px;padding:1px 6px}\n.key[class*=\" k-\"]{display:inline-flex;align-items:center;gap:5px}\n.key[class*=\" k-\"]::before{content:\"\";flex:none;width:9px;height:9px;border-radius:2px;background:var(--k)}\n.k-epic{--k:#904EE2;background:rgba(144,78,226,.18)}\n.k-story{--k:#63BA3C;background:rgba(99,186,60,.2)}\n.k-task,.k-subtask{--k:#4BADE8;background:rgba(75,173,232,.2)}\n.name{font-weight:500;overflow-wrap:anywhere}\na.name{color:var(--to-fg);text-decoration:none;cursor:pointer}a.name:hover{text-decoration:underline}\na.name::after{content:\" 🔗\";font-size:11px}\n.chg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;overflow-wrap:anywhere}\n.from{color:var(--muted)}\n.arrow{color:var(--muted)}\n.to{background:var(--to-bg);color:var(--to-fg);border-radius:999px;padding:1px 9px;font-weight:600}\n.plain{color:var(--muted)}\n.out-h{margin:18px 0 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--out)}\n.out{list-style:none;margin:0;padding:0;display:grid;gap:6px}\n.out li{background:var(--out-bg);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:baseline}\n.out .why{color:var(--muted);font-size:12px}\n.foot{margin:16px 0 0;color:var(--muted);font-size:11.5px}\n.lines{display:grid;grid-template-columns:max-content 1fr;column-gap:12px;row-gap:2px;width:100%}\n.lbl{color:var(--muted)}\n.val{overflow-wrap:anywhere}\n.badges{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 14px}\n.badge{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--chip-bg);color:var(--muted)}\n.badge.state{background:var(--out-bg);color:var(--out)}\n.badge.danger{background:rgba(255,59,48,.13);color:#d70015}\n@media (prefers-color-scheme:dark){.badge.danger{background:rgba(255,69,58,.2);color:#ff6961}}\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\n\u003ch1\u003eCrear en PLAT\u003c/h1\u003e\n\u003cdiv class=\"badges\"\u003e\u003cspan class=\"badge\"\u003e4 issues\u003c/span\u003e\u003cspan class=\"badge\"\u003easignado a Persona del equipo\u003c/span\u003e\u003cspan class=\"badge state\"\u003e⇄ 1 cambio de estado\u003c/span\u003e\u003c/div\u003e\n\u003cul class=\"cards\"\u003e\n\u003cli class=\"card\"\u003e\u003cdiv class=\"top\"\u003e\u003cspan class=\"key k-epic\"\u003eEpic\u003c/span\u003e\u003cspan class=\"name\"\u003eTope de descuento\u003c/span\u003e\u003c/div\u003e\u003c/li\u003e\n\u003cli class=\"card\"\u003e\u003cdiv class=\"top\"\u003e\u003cspan class=\"key k-task\"\u003eTarea\u003c/span\u003e\u003cspan class=\"name\"\u003e[BE] Acotar el descuento\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"chg\"\u003e\u003cspan class=\"to\"\u003eEn progreso\u003c/span\u003e\u003c/div\u003e\u003c/li\u003e\n\u003cli class=\"card\"\u003e\u003cdiv class=\"top\"\u003e\u003cspan class=\"key k-subtask\"\u003eSubtarea\u003c/span\u003e\u003cspan class=\"name\"\u003eTest del tope\u003c/span\u003e\u003c/div\u003e\u003c/li\u003e\n\u003cli class=\"card\"\u003e\u003cdiv class=\"top\"\u003e\u003cspan class=\"key k-task\"\u003eTarea\u003c/span\u003e\u003cspan class=\"name\"\u003e[BE] Documentar el tope\u003c/span\u003e\u003c/div\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp class=\"foot\"\u003eEscape cancela · se cancela sola a los 100 s\u003c/p\u003e\u003c/body\u003e\u003c/html\u003e"},{"type":"term","cmd":"jtk create --spec ~/scratchpad/spec.json --jira-project PLAT --apply --assign-open --project .","out":["Issue        Tipo      Estado       Asignado        Título","PLAT-123     Epic      Backlog      Vos             Tope de descuento","  PLAT-124   Tarea     En progreso  Vos · en curso  [BE] Acotar el descuento","    PLAT-125 Subtarea  Backlog      Vos             Test del tope","  PLAT-126   Tarea     Backlog      Vos             [BE] Documentar el tope","created PLAT-123; local kanban in .jira-team-kit/PLAT-123/"],"source":"inferido","cwd":"~/mi-servicio","notes":"Con el clic, el comando termina: ahora sí hay claves reales, PLAT-123 a PLAT-126. Y quedó el kanban local en .jira-team-kit, que se mantiene sincronizado en los dos sentidos con pull y push. Inferido: escribe en Jira, por eso nunca corre en la captura."},{"type":"worked","seconds":48,"source":"inferido","notes":"El tiempo que le llevó al agente, sin contar lo que tardaste vos en revisar y aprobar."},{"type":"say","md":"Listo: la épica es **PLAT-123**, con 3 issues debajo (PLAT-124 a PLAT-126).\n\n#### Qué quedó\n- **En Jira:** la épica, la tarea en progreso a tu nombre, la subtarea y la tarea abierta\n- **En tu repo:** el kanban local en `.jira-team-kit/PLAT-123/`; lo editás en archivos y lo subís con `jtk push`\n- **En un registro:** cada escritura queda en `.jira-team-kit/jira-writes.jsonl`","source":"inferido","notes":"Cerrá con las tres cosas que quedaron y por qué importan: Jira tiene lo que aprobaste, tu repo tiene un espejo editable, y hay un registro de cada escritura. Si alguien pregunta «¿y quién creó esto?», el registro responde.","pause":true}]},{"id":"otro-caso","title":"Otro caso","subtitle":"Cambiar varios tickets a la vez con jira-em-ops","screen":"cursor-agent","faq":[{"q":"¿Cuántos tickets puedo cambiar de una vez?","a":"Hasta 25 por plan, y hasta 200 si lo pedís con --max. Mover a «entregado» o «descartado» además exige confirmarlo expresamente."},{"q":"¿Qué pasa si alguien cambió un ticket entre el plan y el apply?","a":"Antes de cada escritura jtk vuelve a leer el issue. Si alguien lo movió o lo reasignó después de planificar, lo saltea y te lo informa. Aplicar el mismo plan dos veces es seguro."},{"q":"¿Se puede deshacer?","a":"Hay jtk plan revert con el plan inverso, pero no garantiza deshacer todo, y lo dice. Por eso el plan se revisa antes de aplicarlo."},{"q":"¿Por qué plan y apply son dos pasos?","a":"Porque planificar solo lee Jira y guarda un archivo: es seguro y lo hace el agente solo. Aplicar escribe, y abre la ventana. Separarlos te deja revisar exactamente qué se va a cambiar."}],"steps":[{"type":"ask","text":"Asigná a una compañera del equipo los tickets sin dueño del view plataforma","source":"inferido","notes":"Otro pedido típico: no es crear, es cambiar muchas cosas ya existentes. Esta vez es jira-em-ops, la hermana de jira-team-kit para operaciones en lote. Necesita que antes hayas guardado el view y el perfil de tus boards, una sola vez."},{"type":"tool","label":"Ran · jtk team status plataforma --list --unassigned","source":"inferido","notes":"Primero lista cuáles son, para que el plan trate exactamente de esos tickets y no de un número. La skill lo dice: si pedís «los 7 sin dueño», primero se listan."},{"type":"term","cmd":"jtk plan assign plataforma --unassigned --person \"Persona del equipo\"","out":["Plan 3f9a1c07b2de · assign · view plataforma · 3 issue(s)","  PLAT-131: unassigned -\u003e Persona del equipo","  PLAT-134: unassigned -\u003e Persona del equipo","  PLAT-140: unassigned -\u003e Persona del equipo","","Plan 3f9a1c07b2de saved in ~/.local/state/jtk/plans/3f9a1c07b2de.json. Nothing was written to Jira.","To apply it, run: jtk apply 3f9a1c07b2de","(a window shows the changes and a person clicks Apruebo; with no window, it asks for your approval in a terminal)"],"source":"inferido","notes":"jtk plan solo lee Jira y guarda un archivo con las claves, el estado de origen y el de destino. Fijate el cierre: «Nothing was written to Jira». Por eso esto lo corre el agente sin pedirte nada. Salida inferida: lee Jira, y en la captura no hay Jira.","pause":true},{"type":"say","md":"Armé el plan **3f9a1c07b2de**: asignar a **una compañera del equipo** los **3 tickets sin dueño** de plataforma (PLAT-131, PLAT-134 y PLAT-140). Hasta acá no escribí nada.\n\n¿Lo aplico?","source":"inferido","notes":"El agente muestra el plan tal cual salió y pregunta. Es el segundo punto de control: el primero es el plan, el segundo es tu sí, y el tercero, el clic."},{"type":"ask","text":"Sí, aplicalo.","source":"inferido","notes":"Un sí en el chat habilita al agente a lanzar el comando. No aprueba nada: eso es el clic."},{"type":"say","md":"Voy a correr `jtk apply 3f9a1c07b2de`. **Se abre una ventana** con los 3 cambios y los botones **Cancelar** y **Apruebo 3**. Tu clic es la aprobación; un «sí» en el chat no cuenta.","source":"inferido","notes":"Mismo aviso previo que en el caso principal. La regla de jira-em-ops es todavía más explícita: nunca hacer clic, teclear ni automatizar la ventana.","pause":true},{"type":"approve","title":"Aplicar el plan 3f9a1c07b2de","button":"Apruebo 3","source":"inferido","notes":"Misma ventana, otro plan: «Reasignar», una tarjeta por ticket con de dónde viene y adónde va. Cada título es un link para abrir el ticket antes de aprobar. Formato real, datos de ejemplo.","pause":true,"window":"jtk · Jira","width":520,"height":388,"html":"\u003c!doctype html\u003e\u003chtml\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cstyle\u003e\n:root{color-scheme:light dark;--fg:#1d1d1f;--muted:#6e6e73;--card:rgba(0,0,0,.045);--line:rgba(0,0,0,.08);\n --chip-bg:rgba(0,0,0,.07);--to-bg:rgba(0,113,227,.12);--to-fg:#0058b0;--out:#9a5b00;--out-bg:rgba(255,159,10,.14)}\n@media (prefers-color-scheme:dark){:root{--fg:#f5f5f7;--muted:#a1a1a6;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.1);\n --chip-bg:rgba(255,255,255,.12);--to-bg:rgba(10,132,255,.22);--to-fg:#6cb4ff;--out:#ffb340;--out-bg:rgba(255,159,10,.16)}}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:transparent;color:var(--fg);font:13px/1.4 -apple-system,BlinkMacSystemFont,\"SF Pro Text\",sans-serif;\n -webkit-font-smoothing:antialiased;cursor:default;-webkit-user-select:none}\nbody{padding:22px 24px 8px}\n.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}\nh1{font-size:19px;line-height:1.25;font-weight:650;margin:4px 0 16px}\n.cards{list-style:none;margin:0;padding:0;display:grid;gap:8px}\n.card{background:var(--card);border-radius:10px;padding:10px 12px;display:grid;gap:6px}\n.top{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}\n.key{flex:0 1 auto;min-width:0;overflow-wrap:anywhere;font:600 11.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--chip-bg);border-radius:5px;padding:1px 6px}\n.key[class*=\" k-\"]{display:inline-flex;align-items:center;gap:5px}\n.key[class*=\" k-\"]::before{content:\"\";flex:none;width:9px;height:9px;border-radius:2px;background:var(--k)}\n.k-epic{--k:#904EE2;background:rgba(144,78,226,.18)}\n.k-story{--k:#63BA3C;background:rgba(99,186,60,.2)}\n.k-task,.k-subtask{--k:#4BADE8;background:rgba(75,173,232,.2)}\n.name{font-weight:500;overflow-wrap:anywhere}\na.name{color:var(--to-fg);text-decoration:none;cursor:pointer}a.name:hover{text-decoration:underline}\na.name::after{content:\" 🔗\";font-size:11px}\n.chg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;overflow-wrap:anywhere}\n.from{color:var(--muted)}\n.arrow{color:var(--muted)}\n.to{background:var(--to-bg);color:var(--to-fg);border-radius:999px;padding:1px 9px;font-weight:600}\n.plain{color:var(--muted)}\n.out-h{margin:18px 0 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--out)}\n.out{list-style:none;margin:0;padding:0;display:grid;gap:6px}\n.out li{background:var(--out-bg);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:baseline}\n.out .why{color:var(--muted);font-size:12px}\n.foot{margin:16px 0 0;color:var(--muted);font-size:11.5px}\n.lines{display:grid;grid-template-columns:max-content 1fr;column-gap:12px;row-gap:2px;width:100%}\n.lbl{color:var(--muted)}\n.val{overflow-wrap:anywhere}\n.badges{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 14px}\n.badge{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--chip-bg);color:var(--muted)}\n.badge.state{background:var(--out-bg);color:var(--out)}\n.badge.danger{background:rgba(255,59,48,.13);color:#d70015}\n@media (prefers-color-scheme:dark){.badge.danger{background:rgba(255,69,58,.2);color:#ff6961}}\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\n\u003ch1\u003eReasignar\u003c/h1\u003e\n\u003cdiv class=\"badges\"\u003e\u003cspan class=\"badge\"\u003e3 issues\u003c/span\u003e\u003c/div\u003e\n\u003cul class=\"cards\"\u003e\n\u003cli class=\"card\"\u003e\u003cdiv class=\"top\"\u003e\u003cspan class=\"key\"\u003ePLAT-131\u003c/span\u003e\u003ca class=\"name\" href=\"https://example.atlassian.net/browse/PLAT-131\" target=\"_blank\"\u003eOrdenar por fecha en el listado\u003c/a\u003e\u003c/div\u003e\u003cdiv class=\"chg\"\u003e\u003cspan class=\"from\"\u003eunassigned\u003c/span\u003e\u003cspan class=\"arrow\"\u003e→\u003c/span\u003e\u003cspan class=\"to\"\u003ePersona del equipo\u003c/span\u003e\u003c/div\u003e\u003c/li\u003e\n\u003cli class=\"card\"\u003e\u003cdiv class=\"top\"\u003e\u003cspan class=\"key\"\u003ePLAT-134\u003c/span\u003e\u003ca class=\"name\" href=\"https://example.atlassian.net/browse/PLAT-134\" target=\"_blank\"\u003eMensaje de error del cupón\u003c/a\u003e\u003c/div\u003e\u003cdiv class=\"chg\"\u003e\u003cspan class=\"from\"\u003eunassigned\u003c/span\u003e\u003cspan class=\"arrow\"\u003e→\u003c/span\u003e\u003cspan class=\"to\"\u003ePersona del equipo\u003c/span\u003e\u003c/div\u003e\u003c/li\u003e\n\u003cli class=\"card\"\u003e\u003cdiv class=\"top\"\u003e\u003cspan class=\"key\"\u003ePLAT-140\u003c/span\u003e\u003ca class=\"name\" href=\"https://example.atlassian.net/browse/PLAT-140\" target=\"_blank\"\u003ePaginar el historial\u003c/a\u003e\u003c/div\u003e\u003cdiv class=\"chg\"\u003e\u003cspan class=\"from\"\u003eunassigned\u003c/span\u003e\u003cspan class=\"arrow\"\u003e→\u003c/span\u003e\u003cspan class=\"to\"\u003ePersona del equipo\u003c/span\u003e\u003c/div\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp class=\"foot\"\u003eEscape cancela · se cancela sola a los 100 s\u003c/p\u003e\u003c/body\u003e\u003c/html\u003e"},{"type":"term","cmd":"jtk apply 3f9a1c07b2de","out":["PLAT-131  applied","PLAT-134  applied","PLAT-140  applied"],"source":"inferido","notes":"Apply ejecuta exactamente ese plan, ticket por ticket, y dice qué pasó con cada uno. Si alguno hubiera cambiado mientras tanto, diría que lo saltea. Inferido: escribe en Jira."},{"type":"say","md":"Aplicado: los **3 tickets** son de la compañera ahora. Si querés ver cómo quedó el equipo, corro `jtk team status plataforma`; y si querés volver atrás, `jtk plan revert 3f9a1c07b2de` (no garantiza deshacer todo).","source":"inferido","notes":"Dos salidas después de aplicar: ver el resultado o planificar la inversa. Siempre ofrecidas, nunca hechas sin que lo pidas.","pause":true}]},{"id":"las-otras-skills","title":"Las otras skills","subtitle":"Las que solo leen Jira","screen":"cursor-agent","faq":[{"q":"¿Estas dos también necesitan la ventana?","a":"No. jira-standup y jira-em solo leen: nunca escriben en Jira. Por eso ni siquiera piden aprobación."},{"q":"¿Qué es un «view»?","a":"Una lista guardada de los boards y del equipo que seguís. La armás una sola vez con jtk team setup y después preguntás por «mi equipo» sin repetir nada."},{"q":"¿Puedo preguntar por otra persona?","a":"Sí, con su nombre. Si hay dos personas que coinciden, jtk lista a los candidatos con su email y te pregunta; nunca elige entre dos."}],"steps":[{"type":"ask","text":"¿Qué hice ayer?","source":"inferido","notes":"jira-standup. Tres preguntas personales: qué hiciste, qué podés hacer, en qué estás bloqueado. Más la carga de un compañero y tus métricas de entrega."},{"type":"tool","label":"Ran · jtk done --when yesterday","source":"inferido","notes":"El agente traduce «ayer» a un nombre de ventana y el CLI hace el calendario. Lee Jira en vivo y muestra la salida tal cual, como árbol de épica, tarea y subtarea."},{"type":"say","md":"Ayer pasaste **2 issues** a En progreso o Done: **PLAT-124** (el tope al descuento) y **PLAT-125**. La ventana fue ayer, de lunes a domingo en la zona del equipo.\n\nRecordá que «hecho» significa asignado a vos: si otra persona cerró un issue tuyo, igual aparece.","source":"inferido","notes":"Las skills de lectura dicen qué es y qué no es cada número. Salida de ejemplo, inferida: depende del Jira de cada quien.","pause":true},{"type":"ask","text":"¿Cómo viene mi equipo? ¿Qué está estancado?","source":"inferido","notes":"jira-em: para quien sigue varios boards y un equipo, no para uno mismo. La diferencia con standup es el «mi equipo»."},{"type":"tool","label":"Ran · jtk team status plataforma","source":"inferido","notes":"jira-em traduce «cómo viene mi equipo» a jtk team status. Cada board necesita su perfil: qué estado es «hecho» o «en curso». Si falta, te lo pregunta; no lo adivina."},{"type":"say","md":"## Estado del equipo\n**View:** plataforma · **Boards:** PLAT · **Equipo:** grupo team · **Consultado:** 2026-10-20 · **Perfiles:** confirmados\n\n**7 abiertos** (issues del equipo y sin asignar)\n\n### Por board\n| Board | Abiertos | Por hacer | En curso | Bloqueado | Esperando | Sin rol | Sin asignar |\n| ----- | -------- | --------- | -------- | --------- | --------- | ------- | ----------- |\n| PLAT  | 7        | 3         | 3        | 1         | 0         | 0       | 0           |\n\n### Por persona y board\n| Persona            | Board | Abiertos | Por hacer | En curso | Bloqueado | Esperando | Sin rol | WIP | Límite | Veredicto      |\n| ------------------ | ----- | -------- | --------- | -------- | --------- | --------- | ------- | --- | ------ | -------------- |\n| Ana Gómez          | PLAT  | 2        | 0         | 2        | 0         | 0         | 0       | 2   | 3      | espacio para 1 |\n| Beto Ruiz          | PLAT  | 2        | 0         | 1        | 1         | 0         | 0       | 2   | 3      | espacio para 1 |\n| Persona del equipo | PLAT  | 3        | 3         | 0        | 0         | 0         | 0       | 0   | 3      | espacio para 3 |\n\n### Límites\n- «Sin rol» son issues en estados que el perfil todavía no decidió o no conoce.\n- «Sin asignar» cuenta lo abierto sin dueño en esos boards, sea o no del equipo; lo asignado a otras personas no se cuenta.\n- El veredicto de carga sale del límite de WIP de cada perfil (`jtk board limit KEY N`); sin límite, solo números.","source":"inferido","pause":true,"notes":"La skill muestra la salida tal cual: ya es Markdown y cierra con «Límites». Formato real de jtk, datos inventados. Los 3 que asignamos recién ya tienen dueño: «Sin asignar» da 0."},{"type":"tool","label":"Ran · jtk team stalled plataforma","source":"inferido","notes":"«Qué está estancado» es jtk team stalled, con los 7 días del view."},{"type":"say","md":"## Estancados\n**View:** plataforma · **Boards:** PLAT · **Equipo:** grupo team · **Consultado:** 2026-10-20 · **Perfiles:** confirmados\n\n**2 de 3 en curso** llevan 7 días o más en su categoría\n\n| Key      | Título                          | Dueño     | Estado   | Días en la categoría | Días desde la última edición |\n| -------- | ------------------------------- | --------- | -------- | -------------------- | ---------------------------- |\n| PLAT-118 | Migrar el cálculo de envíos     | Ana Gómez | En curso | 15                   | 11                           |\n| PLAT-121 | Reintentos del webhook de pagos | Beto Ruiz | En curso | 11                   | 4                            |\n\n### Límites\n- «Estancado» no es «sin progreso»: la categoría de Jira solo cambia al pasar de una categoría a otra, así que moverse entre dos estados «en curso» no reinicia los días en la categoría.\n- Los días desde la última edición se reinician con cualquier cambio, comentarios incluidos.","source":"inferido","pause":true,"notes":"Estancado no es «sin progreso»: moverse entre dos estados «en curso» no reinicia la cuenta. Por eso está la última columna: PLAT-121 se tocó hace 4 días."},{"type":"ask","text":"¿Y cuáles son las cuatro skills, en resumen?","source":"inferido","notes":"Cierre del capítulo: el mapa completo."},{"type":"say","md":"#### Las cuatro skills\n- **jira-team-kit:** crea épicas desde la conversación y las sincroniza con pull y push\n- **jira-standup:** qué hiciste, qué podés hacer, qué te bloquea\n- **jira-em:** cómo viene el equipo y los boards, solo lectura\n- **jira-em-ops:** cambios en lote con plan y aprobación\n\nLas dos que escriben pasan siempre por la ventana. Las dos que leen, nunca escriben.","source":"inferido","notes":"El resumen del episodio en una tabla mental: dos leen, dos escriben, y las que escriben pasan por la ventana. Si recordás una sola cosa, que sea esa.","pause":true}]},{"id":"si-algo-falla","title":"Si algo falla","subtitle":"Los errores más comunes y cómo salir","screen":"terminal","faq":[{"q":"«No encuentro las credenciales», pero ya las puse","a":"Casi seguro Cursor se abrió antes de que las variables existieran. Cerralo del todo y abrilo de nuevo. Si sigue, revisá las tres variables, con los nombres exactos."},{"q":"Puse el token y no entra","a":"Lo más probable es que lo creaste «con alcance». jtk entra por la URL de tu sitio con tu email y el token, y un token con alcance solo funciona por api.atlassian.com. Creá otro con el botón sin alcance."},{"q":"La ventana no aparece y el comando termina sin escribir","a":"Puede ser que no hay ventana (no es macOS, estás por ssh o sin sesión gráfica) o que la cancelaste o pasaron 100 segundos. Sin ventana, el comando sale con código 3 e imprime la línea para correr en una terminal real."},{"q":"El agente dice que falta un campo del spec","a":"Pedile que complete el por qué, el qué y el hecho cuando de ese issue. Con una descripción libre jtk se niega."}],"steps":[{"type":"term","cmd":"readlink ~/.local/bin/jtk","out":["~/skills/jira-kanban/jtk.py"],"source":"real","cwd":"~","notes":"Si el agente dice que jtk no existe, mirá primero si el enlace está. Acá apunta al clon, o sea el instalador anduvo. Entonces lo que falta es el PATH: la línea del ~/.zshrc y una terminal nueva."},{"type":"term","cmd":"~/.local/bin/jtk who \"Persona del equipo\" --jira-project PLAT","out":["jtk: Jira credentials not found (set JIRA_BASE_URL, JIRA_EMAIL and JIRA_API_TOKEN in the environment, ./.env.local or ./.spec-kit/.env)","# exit 1"],"source":"real","cwd":"~","notes":"El segundo error típico, sin credenciales: jtk no entra y lo dice con las tres variables que busca. Es el mismo comando que se usa para comprobar que todo anda, porque solo lee. Acá falla a propósito: la captura no tiene tu Jira.","pause":true}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás","screen":"cursor-agent","faq":[{"q":"¿Cuándo la uso?","a":"Al cerrar un trabajo para dejarlo registrado, o antes de empezar uno para planificarlo en Jira. Y los cambios en lote, cuando el número de tickets ya duele hacerlos a mano."},{"q":"¿Reemplaza a Jira?","a":"No. Es una puerta con control: escribe en tu Jira con tu aprobación y deja un espejo local. Jira sigue siendo la fuente de verdad."},{"q":"¿Qué necesito para el próximo episodio?","a":"Lo del episodio 0 y haber hecho este: confluence-team-kit usa la misma idea de plan y aprobación, pero para Confluence."}],"steps":[{"type":"ask","text":"¿Qué me llevo de esto?","source":"inferido","notes":"Cerrá con las tres ideas; no repitas el episodio."},{"type":"say","md":"#### Lo que te llevás\n- **Un pedido de una frase** alcanza: «creame una épica para esto» y la skill trae el formato y el orden.\n- **Nada se escribe sin tu clic:** primero un dry run para revisar, después una ventana con el detalle. El agente avisa, vos aprobás.\n- **Quedan un espejo local y un registro** de cada escritura.\n\n#### Próximo episodio: confluence-team-kit\nCómo publicar la documentación de tu repo en Confluence sin pisar a nadie: un plan, el aviso si alguien editó la página y una aprobación humana.","source":"inferido","notes":"Las tres ideas son el porqué de adoptarla: poco esfuerzo, control y rastro. El próximo episodio sigue con la misma lógica de plan y aprobación, ahora para la documentación. Si cambia el orden de la serie, cambiá la línea del próximo episodio.","pause":true}]}]}]</script>
<script>
// Pure navigation over an episode: the global index is the flattened list of
// (chapter card + its steps). No DOM, no state.
// keyAction(KeyboardEvent.key) -> "right" | "left" | "space" | "b" | null: the presenter
// keys, shared by the control and the stage. PageDown/PageUp act as the arrows because
// presentation clickers send them.
var Nav = (function () {
  function flatten(ep) {
    var out = [];
    (ep.chapters || []).forEach(function (ch, i) {
      out.push({chapter: i, step: -1, kind: "card"});
      (ch.steps || []).forEach(function (st, j) {
        out.push({chapter: i, step: j, kind: st.type});
      });
    });
    return out;
  }

  function clamp(ep, i) {
    var last = flatten(ep).length - 1;
    return Math.max(0, Math.min(Math.floor(i) || 0, Math.max(last, 0)));
  }

  function nextChapter(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    for (var k = i + 1; k < flat.length; k++) {
      if (flat[k].step === -1) return k;
    }
    return Math.max(flat.length - 1, 0);
  }

  function prevChapter(ep, i) {
    var flat = flatten(ep);
    i = clamp(ep, i);
    var cur = i;
    while (cur > 0 && flat[cur].step !== -1) cur--;
    if (cur < i) return cur;
    for (var k = i - 1; k >= 0; k--) {
      if (flat[k].step === -1) return k;
    }
    return 0;
  }

  }

  var api = {step: step, markdown: markdown, clockText: clockText,

<script>
// Forward animation of ONE step, plus the playback policy as pure functions.
//
// Animate.run(container, episode, index, opts) -> {cancel(), done: Promise}
//   Renders the finished state with Render.step(container, episode, index), hides the
//   current step's hooks (see render.js header) and reveals them in document order on
//   the injected scheduler, so it looks like the step at `index` playing on top of
//   Render.step(index - 1). Both completion and cancel() end with a fresh
//   Render.step(container, episode, index): the final DOM is identical by construction.
//   `done` resolves in both cases (never rejects). A new run on the same container
//   cancels the previous one first, and a reveal that throws ends the run in the final
//   state too. A page or approve step is the exception: its window holds an iframe that a
//   fresh render would rebuild (blank until it loads again), so when it completes on its
//   own the run only clears the inline styles it set, which leaves the same DOM.
// Animate.stop(container): cancels the active run on `container` without rendering
//   (call it before a static Render.step, e.g. on a back-step).
//   opts: {speed = 1 (clamped to >= 0.1), schedule(fn, ms) -> id = setTimeout,
//          unschedule(id) = clearTimeout, now() = Date.now (accepted, not used: every
//          wait goes through schedule)}.
//
// Timing (every value is divided by speed):
//   type  28 ms per character (code points), the text grows one character per tick
//   line  120 ms per line / say block
//   node  250 ms, then the node appears whole (tool, worked, chips)
//   fade  250 ms for a card, an approve window and a page: opacity 0 until the tick.
//         A page right after a page (or an approve right after an approve) keeps the window
//         on screen and only waits: the browser does not blink between them (continuesWindow).
//   autoplay delay between steps 900 ms
// Animate.stepDuration walks the same plan the animation schedules, so the estimate
// and the playback cannot drift apart.
var Animate = (function () {
  var CHAR_MS = 28;
  var LINE_MS = 120;
  var NODE_MS = 250;
  var FADE_MS = 250;
  var AUTOPLAY_MS = 900;
  var MIN_SPEED = 0.1;

  function speedOf(s) {
    s = Number(s);
    if (!(s > 0)) s = MIN_SPEED;
    return Math.max(s, MIN_SPEED);
  }
  function chars(text) { return Array.from(String(text || "")); }
  function hide(n) { n.style.display = "none"; }
  function show(n) { n.style.display = ""; }

  // True when the step at `index` is a page or approve right after another of the same type
  // in its chapter: the window was already on screen, so it does not fade in again.
  function continuesWindow(ep, index) {
    var flat = Nav.flatten(ep);
    var e = flat[Nav.clamp(ep, index)];
    if (!e || e.step < 1 || (e.kind !== "page" && e.kind !== "approve")) return false;
    return ep.chapters[e.chapter].steps[e.step - 1].type === e.kind;
  }

  // Render the finished state into `container`, hide what the step at `index` adds and
  // return the reveal plan: [{ms, fn}] in order (ms already divided by speed).
  function prepare(container, ep, index, speed) {
    Render.step(container, ep, index);
    var flat = Nav.flatten(ep);
    if (!flat.length) return [];
    var e = flat[Nav.clamp(ep, index)];
    var plan = [];
    var screen = container.firstChild;
    if (e.step === -1) {
      screen.style.opacity = "0";
      plan.push({ms: FADE_MS / speed, fn: function () { screen.style.opacity = "1"; }});
      return plan;
    }
    var root = container.querySelector('[data-step="' + e.step + '"]');
    if (!root) return plan;
    var step = ep.chapters[e.chapter].steps[e.step];
    // The idle prompt lives in the zsh panel (cursor-full) and on the terminal screen: hide
    // it only when this step plays in that same flow, not for a chat-placed agent command.
    // On claude-code, `in: "zsh"` is the person's `!` line and there is no idle prompt, so
    // the lookup below finds nothing.
    if (step.type === "term" && (step["in"] === "zsh" || ep.chapters[e.chapter].screen === "terminal")) {
      var idle = container.querySelector('[data-anim="idle"]');
      if (idle) hide(idle);
    }
    var hooks = [];
    if (root.hasAttribute("data-anim")) hooks.push(root);
    Array.prototype.forEach.call(root.querySelectorAll("[data-anim]"), function (n) { hooks.push(n); });
    hooks.forEach(function (n) {
      var kind = n.getAttribute("data-anim");
      if (kind === "type") {
        var cs = chars(n.textContent);
        n.textContent = "";
        cs.forEach(function (_, k) {
          plan.push({ms: CHAR_MS / speed, fn: function () { n.textContent = cs.slice(0, k + 1).join(""); }});
        });
      } else if (kind === "line") {
        hide(n);
        plan.push({ms: LINE_MS / speed, fn: function () { show(n); }});
      } else if (kind === "node" && (step.type === "approve" || step.type === "page") && n === root) {
        if (continuesWindow(ep, index)) {
          plan.push({ms: FADE_MS / speed, fn: function () {}});
        } else {
          n.style.opacity = "0";
          plan.push({ms: FADE_MS / speed, fn: function () { n.style.opacity = ""; }});
        }
      } else if (kind === "node") {
        hide(n);
        plan.push({ms: NODE_MS / speed, fn: function () { show(n); }});
      }
    });
    if (step.type === "approve" || step.type === "page") {
      plan.finish = function () {
        hooks.forEach(function (n) { if (n.getAttribute("style") === "") n.removeAttribute("style"); });
      };
    }
    return plan;
  }

  // One active run per container: a new run (or stop) cancels the previous one first.
  var active = typeof WeakMap === "function" ? new WeakMap() : null;
  function getActive(c) { return active ? active.get(c) : c.__wsAnimRun; }
  function setActive(c, r) { if (active) active.set(c, r); else c.__wsAnimRun = r; }
  function clearActive(c, r) {
    if (getActive(c) !== r) return;
    if (active) active.delete(c); else delete c.__wsAnimRun;
  }

  // Cancel any active run on `container` without rendering (its `done` resolves).
  function stop(container) {
    var r = getActive(container);
    if (r) r.abort();
  }

  function run(container, ep, index, opts) {
    opts = opts || {};
    stop(container);
    var speed = speedOf(opts.speed === undefined ? 1 : opts.speed);
    var schedule = opts.schedule || function (fn, ms) { return setTimeout(fn, ms); };
    var unschedule = opts.unschedule || function (id) { clearTimeout(id); };
    var finished = false, timer = null, resolveDone;
    var done = new Promise(function (resolve) { resolveDone = resolve; });
    var handle = {cancel: function () { end(true); }, done: done, abort: function () { end(false); }};
    setActive(container, handle);
    var plan = prepare(container, ep, index, speed);

    function end(render) {
      if (finished) return;
      finished = true;
      if (timer !== null) { unschedule(timer); timer = null; }
      clearActive(container, handle);
      if (render) Render.step(container, ep, index);
      resolveDone();
    }
    function next(k) {
      if (finished) return;
      if (k >= plan.length) {
        if (plan.finish) { plan.finish(); end(false); } else end(true);
        return;
      }
      timer = schedule(function () {
        timer = null;
        if (finished) return;
        try {
          plan[k].fn();
        } catch (err) {
          // A broken reveal must not stall playback: jump to the final state.
          if (typeof console !== "undefined") console.error("Animate: reveal failed", err);
          end(true);
          return;
        }
        next(k + 1);
      }, plan[k].ms);
    }
    next(0);
    return {cancel: handle.cancel, done: done};
  }

  // Sum of the ms the animation of `index` schedules (same plan, detached container).
  function stepDuration(ep, index, speed) {
    var plan = prepare(document.createElement("div"), ep, index, speedOf(speed));
    return plan.reduce(function (s, a) { return s + a.ms; }, 0);
  }

  // What autoplay does after `index` finished animating.
  function autoplay(ep, index, speed) {
    var flat = Nav.flatten(ep);
    var i = Nav.clamp(ep, index);
    if (!flat.length || i >= flat.length - 1) return {stop: true, delay: 0};
    var e = flat[i];
    var steps = ep.chapters[e.chapter].steps || [];
    if (e.step === steps.length - 1) return {stop: true, delay: 0};  // also an empty chapter's card
    if (e.step >= 0 && steps[e.step].pause) return {stop: true, delay: 0};
    return {stop: false, delay: AUTOPLAY_MS / speedOf(speed)};
  }

  // Estimated length: step animations plus autoplay delays (none after a stop).
  function episodeDuration(ep, speed) {
    var flat = Nav.flatten(ep);
    var chapters = (ep.chapters || []).map(function (ch) { return {id: ch.id, ms: 0}; });
    var total = 0;
    flat.forEach(function (e, i) {
      var a = autoplay(ep, i, speed);
      var ms = stepDuration(ep, i, speed) + (a.stop ? 0 : a.delay);
      chapters[e.chapter].ms += ms;
      total += ms;
    });
    return {total: total, chapters: chapters};
  }

  return {run: run, stop: stop, continuesWindow: continuesWindow, stepDuration: stepDuration, autoplay: autoplay, episodeDuration: episodeDuration,
          CHAR_MS: CHAR_MS, LINE_MS: LINE_MS, NODE_MS: NODE_MS, FADE_MS: FADE_MS, AUTOPLAY_MS: AUTOPLAY_MS};
})();
